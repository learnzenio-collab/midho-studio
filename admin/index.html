<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E43AB">
<title>Midho Studio — Admin</title>
<link rel="icon" type="image/png" href="/assets/midho-logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin-v5.css">
</head>
<body>
<main id="loginView" class="auth-screen">
<section class="auth-card">
<img data-brand-logo src="/assets/midho-logo-white.png" alt="Midho Studio">
<span>ADMIN ACCESS</span>
<h1>Masukkan PIN</h1>
<p>Kelola klien, project, portfolio, dan website.</p>
<form id="pinForm">
<label>PIN Admin<input type="password" name="pin" inputmode="numeric" required autocomplete="current-password" placeholder="•••••••••••"></label>
<button>Masuk Dashboard</button>
</form>
<a href="/">← Kembali ke website</a>
</section>
</main>
<div id="adminView" class="admin-shell" hidden>
<aside class="admin-rail" id="adminRail">
<a class="admin-brand" href="/"><img data-brand-logo src="/assets/midho-logo-white.png" alt="Midho Studio"></a>
<nav>
<button class="active" data-nav="overview"><span>⌂</span>Overview</button>
<button data-nav="clients"><span>◎</span>Klien</button>
<button data-nav="projects"><span>▦</span>Project</button>
<button data-nav="portfolio"><span>◫</span>Portfolio</button>
<button data-nav="settings"><span>⚙</span>Pengaturan</button>
</nav>
<div class="admin-rail-bottom">
<a href="/" target="_blank">Preview Website ↗</a>
<button id="logoutBtn"><span>↪</span>Logout</button>
</div>
</aside>
<section class="admin-work">
<header class="admin-top">
<button class="admin-menu" id="adminMenu">☰</button>
<div><small>Midho Studio</small><strong id="adminCurrent">Overview</strong></div>
<a href="/" target="_blank">Preview ↗</a>
</header>
<div class="admin-content" id="mainContent"></div>
</section>
</div>
<div id="modalRoot"></div>
<div class="admin-toast" id="adminToast"></div>
<script src="/assets/store-v4.js"></script>
<script src="/assets/admin-core-v4.js"></script>
<script src="/assets/admin-pages-v5.js"></script>
<script src="/assets/admin-actions-v5.js"></script>
</body>
</html>
